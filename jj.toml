#:schema https://docs.jj-vcs.dev/latest/config-schema.json

[user]
email = "lucas@lucaspickering.me"
name = "Lucas Pickering"

[aliases]
abn = ["abandon"]
bk = ["bookmark"]
dup = ["duplicate"]
l = ["log", "-r", "root()..@"]
lg = ["log", "-r", "all()"]
sq = ["squash"]

[git]
private-commits = "private()"

[revsets]
bookmark-advance-to = 'closest_pushable(@)'

[revset-aliases]
# Closest revision that is mutable, described, not private, and either non-empty or a merge
"closest_pushable(to)" = """
  heads(::to & mutable() & ~description(exact:"") & ~private() & (~empty() | merges()))
"""
# Prevent pushing anything explicitly labeled "private" (via git.private-commits)
"private()" = "description('private:*')"
