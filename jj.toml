#:schema https://docs.jj-vcs.dev/latest/config-schema.json

[user]
email = "lucas@lucaspickering.me"
name = "Lucas Pickering"

[aliases]
abn = {definition = ["abandon"], doc = "abandon"}
bk = {definition = ["bookmark"], doc = "bookmark"}
dup = {definition = ["duplicate"], doc = "duplicate"}
l = {definition = ["log", "-r", "root()..@"], doc = "log all history"}
ld.definition = ["log", "-r", "dangling() | parents(roots(trunk()..heads(dangling())))"] # Dangling + shared commit w/ trunk()
ld.doc = "log dangling"
lg = {definition = ["log", "-r", "all()"], doc = "log all branches"}
lm = {definition = ["log", "-r", "root()..@ | ancestors(trunk(), 3)"], doc = "log current and trunk"}
sq = {definition = ["squash"], doc = "squash"}

[git]
private-commits = "private()"

[revsets]
bookmark-advance-to = 'closest_pushable(@)'

[revset-aliases]
# Closest revision that is mutable, described, not private, and either non-empty or a merge
"closest_pushable(to)" = """
  heads(::to & mutable() & ~description(exact:"") & ~private() & (~empty() | merges()))
"""
# Prevent pushing anything explicitly labeled "private" (via git.private-commits)
"private()" = "description('private:*')"
# Revisions that aren't bookmarked
"dangling()" = "~ ::bookmarks()"
